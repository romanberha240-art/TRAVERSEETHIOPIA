<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Traverse Ethiopia | Admin</title><link rel="stylesheet" href="css/style.css"><style>body{background:#f7f2e9}.admin{max-width:1050px;margin:70px auto;padding:24px}.panel{background:#fff;padding:28px;border-radius:14px;box-shadow:0 8px 30px #0001;margin-bottom:24px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}label{display:grid;gap:6px;font-weight:600}input,textarea,select{padding:12px;border:1px solid #ddd;border-radius:8px;font:inherit}textarea{min-height:150px}.wide{grid-column:1/-1}.actions{display:flex;gap:10px;margin-top:18px}.hidden{display:none}.item{border-top:1px solid #eee;padding:16px 0;display:flex;justify-content:space-between;gap:18px}.muted{color:#777}@media(max-width:700px){.grid{grid-template-columns:1fr}.wide{grid-column:auto}}</style></head><body><main class="admin"><div class="panel" id="loginPanel"><h1>Traverse Ethiopia Admin</h1><p class="muted">Sign in to manage itineraries, stories, and images.</p><form id="loginForm" class="grid"><label>Username<input id="adminUsername" autocomplete="username" required></label><label>Password<input id="adminPassword" type="password" autocomplete="current-password" required></label><div class="wide actions"><button class="btn btn-primary">Sign in</button></div></form><p id="loginStatus" role="alert"></p></div><section class="panel hidden" id="dashboard"><div style="display:flex;justify-content:space-between;align-items:center"><div><h1>Content manager</h1><p class="muted">Create content without editing the website code.</p></div><button id="logout" class="btn">Sign out</button></div><form id="contentForm" class="grid"><label>Content type<select id="type"><option value="itinerary">Itinerary</option><option value="post">Post</option><option value="image">Image</option></select></label><label>Title<input id="title" required></label><label>Slug<input id="slug" placeholder="optional-url-slug"></label><label>Image URL<input id="image_url" type="url" placeholder="https://..."></label><label class="wide">Short description<textarea id="excerpt"></textarea></label><label class="wide">Content / itinerary details<textarea id="body"></textarea></label><label><span>Published</span><input id="published" type="checkbox"></label><div class="wide actions"><button class="btn btn-primary">Save content</button><button type="button" id="clear" class="btn">Clear</button></div></form><p id="contentStatus" role="status"></p><h2>Existing content</h2><div id="items"><p class="muted">Loading…</p></div></section></main><script src="api-config.js"></script><script src="admin.js"></script></body></html>
